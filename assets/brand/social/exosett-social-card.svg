<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  width="1200"
  height="630"
  viewBox="0 0 1200 630"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">ExoSett — Buildings that can evolve</title>
  <desc id="description">
    ExoSett brand card with an accommodation frame and a replaceable module
    moving into an open cell.
  </desc>

  <defs>
    <style>
      @font-face {
        font-family: "IBM Plex Sans";
        src: url("../../fonts/ibm-plex-sans/IBMPlexSans-Regular.woff2") format("woff2");
        font-weight: 400;
      }

      @font-face {
        font-family: "IBM Plex Sans";
        src: url("../../fonts/ibm-plex-sans/IBMPlexSans-Medium.woff2") format("woff2");
        font-weight: 500;
      }

      .type {
        font-family: "IBM Plex Sans", Arial, sans-serif;
      }
    </style>

    <marker
      id="arrowhead"
      viewBox="0 0 10 10"
      refX="8"
      refY="5"
      markerWidth="8"
      markerHeight="8"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#111111" />
    </marker>
  </defs>

  <rect width="1200" height="630" fill="#f5f5f3" />

  <!-- Brand and message: kept well inside common social-platform crop areas. -->
  <image
    x="78"
    y="72"
    width="322"
    height="78"
    preserveAspectRatio="xMinYMid meet"
    href="data:image/svg+xml;base64,"
  />

  <text
    class="type"
    x="78"
    y="270"
    fill="#111111"
    font-size="58"
    font-weight="500"
    letter-spacing="-1.6"
  >Buildings that can evolve</text>

  <text
    class="type"
    x="80"
    y="324"
    fill="#5f5f5f"
    font-size="23"
    font-weight="400"
  >
    <tspan x="80" dy="0">Modular accommodation frames</tspan>
    <tspan x="80" dy="34">with replaceable modules</tspan>
  </text>

  <line x1="80" y1="492" x2="520" y2="492" stroke="#b8b8b8" stroke-width="2" />
  <text
    class="type"
    x="80"
    y="532"
    fill="#5f5f5f"
    font-size="17"
    font-weight="500"
    letter-spacing="1.3"
  >AN ADAPTABLE BUILDING SYSTEM</text>

  <!-- Simplified accommodation frame. -->
  <g aria-label="Schematic accommodation frame" fill="none" stroke="#111111">
    <g stroke-width="7" stroke-linecap="round">
      <path d="M 706 145 H 1084 M 706 294 H 1084 M 706 443 H 1084" />
      <path d="M 706 145 V 443 M 832 145 V 443 M 958 145 V 443 M 1084 145 V 443" />
    </g>

    <g fill="#f5f5f3" stroke-width="5">
      <circle cx="706" cy="145" r="12" />
      <circle cx="832" cy="145" r="12" />
      <circle cx="958" cy="145" r="12" />
      <circle cx="1084" cy="145" r="12" />
      <circle cx="706" cy="294" r="12" />
      <circle cx="832" cy="294" r="12" />
      <circle cx="958" cy="294" r="12" />
      <circle cx="1084" cy="294" r="12" />
      <circle cx="706" cy="443" r="12" />
      <circle cx="832" cy="443" r="12" />
      <circle cx="958" cy="443" r="12" />
      <circle cx="1084" cy="443" r="12" />
    </g>
  </g>

  <!-- Installed modules establish the frame as accommodation. -->
  <g stroke="#111111" stroke-width="3">
    <rect x="722" y="162" width="94" height="115" rx="2" fill="#ffffff" />
    <rect x="848" y="162" width="94" height="115" rx="2" fill="#ffffff" />
    <rect x="974" y="311" width="94" height="115" rx="2" fill="#ffffff" />
    <path d="M 742 189 H 796 V 238 H 742 Z M 769 189 V 238" fill="#f5f5f3" />
    <path d="M 868 189 H 922 V 238 H 868 Z M 895 189 V 238" fill="#f5f5f3" />
    <path d="M 994 338 H 1048 V 387 H 994 Z M 1021 338 V 387" fill="#f5f5f3" />
  </g>

  <!-- Replacement module aligned with the open lower-left cell. -->
  <path
    d="M 635 369 H 692"
    fill="none"
    stroke="#111111"
    stroke-width="3"
    stroke-dasharray="7 8"
    marker-end="url(#arrowhead)"
  />
  <g transform="translate(544 311)" stroke="#111111" stroke-width="4">
    <rect width="92" height="115" rx="2" fill="#111111" />
    <path d="M 18 28 H 74 V 78 H 18 Z M 46 28 V 78" fill="#f5f5f3" />
    <path d="M 14 96 H 78" fill="none" stroke="#f5f5f3" stroke-width="3" />
  </g>

  <text
    class="type"
    x="895"
    y="488"
    text-anchor="middle"
    fill="#5f5f5f"
    font-size="16"
    font-weight="500"
    letter-spacing="1.1"
  >FRAME · CELL · MODULE</text>
</svg>
