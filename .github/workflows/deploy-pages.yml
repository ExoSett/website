name: Deploy ExoSett website

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      modelling_ref:
        description: Modelling branch, tag, or commit to publish
        required: false
        default: main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: website-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v7
        with:
          path: website

      - name: Check out modelling
        uses: actions/checkout@v7
        with:
          repository: ExoSett/modelling
          ref: ${{ inputs.modelling_ref || 'main' }}
          token: ${{ secrets.MODELLING_READ_TOKEN || github.token }}
          path: modelling

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: modelling/sketch/package-lock.json

      - name: Install Sketch dependencies
        run: npm ci
        working-directory: modelling/sketch

      - name: Check and build Sketch
        run: npm run check && npm run build:embed
        working-directory: modelling/sketch

      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium
        working-directory: modelling/sketch

      - name: Test Sketch in desktop and mobile layouts
        run: npm run test:e2e
        working-directory: modelling/sketch

      - name: Test site packaging
        run: python3 website/scripts/test_build_site.py

      - name: Assemble combined site
        run: >-
          python3 website/scripts/build_site.py
          --sketch-dist modelling/sketch/dist-embed
          --output _site

      - name: Validate combined site
        run: python3 scripts/validate.py
        working-directory: _site

      - name: Record release revisions
        run: |
          git -C website rev-parse HEAD > _site/website-revision.txt
          git -C modelling rev-parse HEAD > _site/modelling-revision.txt

      - name: Test assembled website
        run: npm run test:release
        working-directory: modelling/sketch
        env:
          SKETCH_SITE_ROOT: ${{ github.workspace }}/_site

      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: |
            modelling/sketch/playwright-report/
            modelling/sketch/test-results/

      - name: Retain tested release
        uses: actions/upload-artifact@v4
        with:
          name: tested-website
          path: _site
          retention-days: 30

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
